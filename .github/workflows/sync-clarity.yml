name: Sync Clarity insights

# 1x por dia, logo após a meia-noite de Brasília (03:05 UTC). A API do Clarity
# só permite 10 chamadas/dia e devolve as últimas 24h — rodar mais vezes não
# traz dado novo e gasta cota. workflow_dispatch serve para rodar na mão.
on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endpoint de sincronização
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/sync-clarity"
