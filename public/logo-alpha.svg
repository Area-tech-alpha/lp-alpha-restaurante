<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" role="img" aria-label="Alpha Assessoria">
  <!-- Double-arrow symbol -->
  <g fill="white">
    <!-- Arrow 1 (left) -->
    <polygon points="4,28 18,10 18,19 30,19 30,10 44,28 30,46 30,37 18,37 18,46" />
    <!-- Arrow 2 (right, offset) -->
